e Plus Slugging",w:"OBP and SLG added together.",y:"A fast offensive summary that correlates well with runs. Its flaw is weighting a point of [[OBP]] the same as a point of [[SLG]].",c:"[[OBP]] + [[SLG]]"},woba:{n:"Weighted On-Base Average",w:"Total offensive value per plate appearance, scaled to look like OBP.",y:"Fixes what [[OPS]] gets wrong \u2014 every outcome carries its real empirical run value. This is the foundation [[wRC+]] and [[WAR]] are built from.",c:"Sum of (each outcome \xD7 its run weight) / ([[AB]] + [[BB]] \u2212 IBB + SF + [[HBP]]). Weights reset annually."},wRcPlus:{n:"Weighted Runs Created Plus",w:"Total offense, park- and league-adjusted, indexed so 100 is average.",y:"The best single number for comparing two bats. 130 means 30% better than league average. Park adjustment makes a Coors hitter comparable to a Petco hitter.",c:"[[wRAA]] per [[PA]], adjusted for park and league, divided by the league average, \xD7100"},war:{n:"Wins Above Replacement",w:"Total value in wins over a freely available replacement player.",y:"The common currency of player valuation. Real caveat: differences under about one win sit inside the error bars, and the defensive inputs are the shakiest part.",c:"(Batting + Baserunning + Fielding + Positional + Replacement) / runs per win. The batting piece is [[wRAA]]."},wRaa:{n:"Weighted Runs Above Average",w:"Runs contributed above a league-average hitter in the same playing time.",y:"The direct input to the batting half of [[WAR]]. Zero is average.",c:"(([[wOBA]] \u2212 league wOBA) / wOBA scale) \xD7 [[PA]]"},wRc:{n:"Weighted Runs Created",w:"Total runs contributed, as a counting stat.",y:"The cumulative form of [[wOBA]], so playing time counts.",c:"((([[wOBA]] \u2212 league wOBA) / scale) + league R per PA) \xD7 [[PA]]"},iso:{n:"Isolated Power",w:"Extra bases per at-bat \u2014 singles stripped out.",y:"[[AVG]] blends contact and power. ISO isolates the thump. League average ~.160; .250+ is elite.",c:"[[SLG]] \u2212 [[AVG]]"},babip:{n:"Batting Avg on Balls In Play",w:"How often batted balls that stay in the park become hits.",y:"The main regression flag. League average is ~.300. Far above and results are likely to fall \u2014 but check line-drive rate and speed first, since both sustainably raise it.",c:"([[H]] \u2212 [[HR]]) / ([[AB]] \u2212 [[SO]] \u2212 [[HR]] + SF)"},kPct:{n:"Strikeout Rate",w:"Strikeouts as a share of plate appearances.",y:"Stabilizes faster than almost any other stat \u2014 meaningful in 60\u2013120 [[PA]]. Preferred over [[K/9]] because it's denominated in opportunities rather than innings.",c:"Hitters: [[SO]] / [[PA]].  Pitchers: [[SO]] / [[BF]]."},bbPct:{n:"Walk Rate",w:"Walks as a share of plate appearances.",y:"Approach and pitch recognition in one number, and it stabilizes early.",c:"Hitters: [[BB]] / [[PA]].  Pitchers: [[BB]] / [[BF]]."},xba:{n:"Expected Batting Average",w:"What the average should have been given contact quality.",y:"Compare to actual [[AVG]]. A 30+ point gap in either direction is worth acting on.",c:"Hit probability per batted ball from exit velocity and launch angle (plus sprint speed on weak contact), drawn from historical outcomes"},xslg:{n:"Expected Slugging",w:"What slugging should have been given contact quality.",y:"Separates real power from lucky doubles down the line. Read against [[SLG]].",c:"Expected total bases per batted ball, modeled from exit velocity and launch angle"},xwoba:{n:"Expected wOBA",w:"What wOBA should have been given contact quality, strikeouts, and walks.",y:"The clearest regression signal available. When this and [[wOBA]] diverge sharply, the results are usually the thing that moves.",c:"[[wOBA]] computed from expected outcomes rather than actual ones"},xwobacon:{n:"Expected wOBA on Contact",w:"Expected wOBA counting only batted balls.",y:"Isolates 'what happens when he hits it' from 'how often he hits it.' A hitter can crush the ball and still be poor overall if his [[K%]] is 35%.",c:"Same as [[xwOBA]], restricted to batted-ball events"},stolenBasePercentage:{n:"Stolen Base Percentage",w:"Share of steal attempts that succeed.",y:"Break-even is roughly 72\u201375%, because a [[CS]] costs about twice what a steal gains. Below that, a base stealer is actively hurting his team.",c:"[[SB]] / ([[SB]] + [[CS]])"},era:{n:"Earned Run Average",w:"Earned runs allowed per nine innings.",y:"The traditional headline number, and heavily contaminated by defense, sequencing, and luck. Read [[FIP]] alongside it, always.",c:"([[ER]] / [[IP]]) \xD7 9"},whip:{n:"Walks + Hits per Inning",w:"Baserunners allowed per inning.",y:"Simple and popular, especially in fantasy. Flawed because it counts a walk and a single the same and rides [[BABIP]] hard.",c:"([[BB]] + [[H]]) / [[IP]]"},fip:{n:"Fielding Independent Pitching",w:"What ERA should be based only on strikeouts, walks, and home runs.",y:"Better than [[ERA]] at predicting next season's ERA. Blind spot: it credits no contact-management skill at all.",c:"((13\xD7[[HR]]) + (3\xD7([[BB]] + [[HBP]])) \u2212 (2\xD7[[SO]])) / [[IP]] + constant (~3.10)"},strikeoutsPer9Inn:{n:"Strikeouts per 9",w:"Strikeout pace per nine innings.",y:"Standard in fantasy, but distorts when a pitcher faces an unusual number of batters per inning. [[K%]] is the cleaner version.",c:"9 \xD7 ([[SO]] / [[IP]])"},walksPer9Inn:{n:"Walks per 9",w:"Walk pace per nine innings.",y:"Command indicator. Same denominator caveat as [[K/9]].",c:"9 \xD7 ([[BB]] / [[IP]])"},homeRunsPer9:{n:"Home Runs per 9",w:"Home run pace per nine innings.",y:"Volatile year to year, which is exactly why xFIP exists \u2014 it swaps real home runs for a league-average rate.",c:"9 \xD7 ([[HR]] / [[IP]])"},strikeoutWalkRatio:{n:"Strikeout to Walk Ratio",w:"Strikeouts divided by walks.",y:"Useful, but distorts at extremes \u2014 a pitcher with two walks posts an absurd ratio. [[K-BB%]] is the more stable framing.",c:"[[SO]] / [[BB]]"},kMinusBB:{n:"K-BB%",w:"The gap between strikeout and walk rate.",y:"The best simple predictor of future pitcher performance. Cleaner than [[K/BB]] because it doesn't blow up on small walk totals.",c:"[[K%]] \u2212 [[BB%]]"},barrelRate:{n:"Barrel Rate",w:"Share of batted balls with an elite exit velocity and launch angle combination.",y:"The best single proxy for damage on contact. Correlates strongly with home run rate and [[ISO]] because it captures hard *and* well-angled, not just one.",c:"Requires 98+ mph exit velocity, with the qualifying launch angle band widening as velocity rises (26\u201330\xB0 at 98 mph, 8\u201350\xB0 at 116 mph)"},hardHitRate:{n:"Hard-Hit Rate",w:"Share of batted balls hit at 95+ mph.",y:"Simpler and more stable than [[Barrel%]] because it ignores angle entirely. 50%+ is elite.",c:"(batted balls \u2265 95 mph) / (total batted balls)"},exitVelo:{n:"Average Exit Velocity",w:"Average speed of the ball off the bat.",y:"The most stable predictor of hitting talent \u2014 it settles in far fewer batted balls than any results-based stat. Hitting the ball hard is a skill; getting hits is partly luck.",c:"Measured directly by Hawk-Eye optical tracking, averaged across batted balls"},launchAngle:{n:"Average Launch Angle",w:"Average vertical angle off the bat, in degrees.",y:"Determines batted-ball type. Below 10\xB0 is a grounder, 10\u201325\xB0 a line drive, 25\u201350\xB0 a fly ball. Pairs with [[EV]] to explain everything.",c:"Measured directly. 0\xB0 is horizontal."},sweetSpot:{n:"Sweet Spot Rate",w:"Share of batted balls in the optimal launch angle band.",y:"Angle consistency, independent of how hard the ball was hit. Read alongside [[Hard-Hit%]] \u2014 strong in both means real damage.",c:"(batted balls with launch angle 8\u201332\xB0) / (total batted balls)"},gamesPlayed:{n:"Games Played",w:"Games appeared in.",y:"Context for every counting stat below it.",c:"Count"},plateAppearances:{n:"Plate Appearances",w:"Total trips to the plate.",y:"The right denominator for rate stats. At-bats exclude walks, which distorts approach-heavy hitters.",c:"Count"},atBats:{n:"At-Bats",w:"Plate appearances excluding walks, HBP, and sacrifices.",y:"The denominator for AVG and SLG, and the reason both understate patient hitters.",c:"Count"},homeRuns:{n:"Home Runs",w:"Balls hit out of the park.",y:"The most valuable single outcome in baseball \u2014 roughly 2.1 runs of wOBA weight.",c:"Count"},rbi:{n:"Runs Batted In",w:"Runners driven home.",y:"Heavily dependent on the hitters in front of you. Two identical hitters can differ by 40 RBI on lineup slot alone.",c:"Count"},runs:{n:"Runs Scored",w:"Times the player crossed the plate.",y:"Same problem as RBI in reverse \u2014 depends on who bats behind him.",c:"Count"},hits:{n:"Hits",w:"Safe hits of any kind.",y:"A counting stat that flattens singles and home runs into one bucket.",c:"Count"},doubles:{n:"Doubles",w:"Two-base hits.",y:"The most park-sensitive extra-base hit.",c:"Count"},triples:{n:"Triples",w:"Three-base hits.",y:"More a function of speed and park dimensions than of hitting skill.",c:"Count"},baseOnBalls:{n:"Walks",w:"Free passes.",y:"Worth roughly .69 in wOBA weight \u2014 most of a single's value, with none of the batting-average credit.",c:"Count"},strikeOuts:{n:"Strikeouts",w:"Batter retired on strikes.",y:"The one out that can never advance a runner.",c:"Count"},stolenBases:{n:"Stolen Bases",w:"Bases taken on the pitcher and catcher.",y:"Only good in context \u2014 see stolen base percentage, since the break-even is high.",c:"Count"},caughtStealing:{n:"Caught Stealing",w:"Failed steal attempts.",y:"Costs roughly twice what a successful steal gains.",c:"Count"},wins:{n:"Wins",w:"Games credited as the winning pitcher.",y:"Depends on run support and bullpen more than on the pitcher. Treat as trivia.",c:"Count"},losses:{n:"Losses",w:"Games credited as the losing pitcher.",y:"Same problem as wins.",c:"Count"},saves:{n:"Saves",w:"Games closed out under save rules.",y:"A function of manager usage, not pitcher quality. Shutdowns and meltdowns are the honest version.",c:"Count per MLB save rule"},inningsPitched:{n:"Innings Pitched",w:"Innings recorded.",y:"Workload \u2014 and the denominator for nearly every rate stat below.",c:"Outs recorded / 3"},earnedRuns:{n:"Earned Runs",w:"Runs charged to the pitcher.",y:"The scorer's judgment on errors makes this less objective than it looks.",c:"Count"},hitBatsmen:{n:"Hit Batsmen",w:"Batters hit by a pitch.",y:"Counts the same as a walk in FIP.",c:"Count"},battersFaced:{n:"Batters Faced",w:"Total plate appearances against.",y:"The correct denominator for a pitcher's K% and BB%.",c:"Count"},gamesStarted:{n:"Games Started",w:"Starts made.",y:"Separates starters from relievers, which changes how every rate stat should be read.",c:"Count"}},rh={opsPlus:{n:"OPS Plus",w:"OPS adjusted for park and league, indexed to 100.",y:"Baseball Reference's counterpart to [[wRC+]]. Similar output, different construction; they rarely disagree materially.",c:"100 \xD7 (OBP/lgOBP + SLG/lgSLG \u2212 1), park-adjusted"},off:{n:"Offensive Runs Above Average",w:"Batting and baserunning value combined, in runs.",y:"The full offensive contribution in one number, before defense and position enter the picture.",c:"[[wRAA]] + [[BsR]], plus a small league adjustment"},rar:{n:"Runs Above Replacement",w:"Total runs above a freely available replacement player.",y:"The intermediate step between component runs and [[WAR]]. Useful when you want to think in runs rather than wins.",c:"Sum of batting, baserunning, fielding, positional, league, and replacement runs"},gbfb:{n:"Batted Ball Mix (GB/LD/FB)",w:"Share of batted balls that are ground balls, line drives, and fly balls.",y:"Explains [[BABIP]] and power. Line drives produce the highest BABIP, near .680; infield flies are near-automatic outs. A ground-ball hitter with power is a mismatch worth flagging.",c:"Each batted ball is classified by trajectory, then divided by total batted balls"},pullOppo:{n:"Pull / Center / Oppo Rate",w:"Directional distribution of batted balls.",y:"Explains platoon splits and power profile \u2014 pulled fly balls carry much farther than opposite-field ones.",c:"Batted balls to each field, as a share of the total"},softHard:{n:"Soft / Medium / Hard Rate",w:"FanGraphs' contact-quality buckets, predating Statcast.",y:"The legacy version of [[Hard-Hit%]]. Useful for comparisons back before 2015; superseded by measured exit velocity since.",c:"Classified from hang time, distance, and trajectory rather than measured velocity"},batSpeed:{n:"Bat Speed",w:"How fast the bat is moving at contact, in mph.",y:"Raw power input, and one of the most stable skills in the data \u2014 roughly 1 mph buys about six feet of fly-ball distance. MLB average is around 71\u201372 mph.",c:"Measured six inches from the bat head, averaged over competitive swings"},fastSwing:{n:"Fast-Swing Rate",w:"Share of competitive swings at 75+ mph.",y:"Separates a hitter who occasionally uncorks a big swing from one who does it every time. About 22% of MLB swings clear the bar.",c:"(swings \u2265 75 mph) / (competitive swings)"},swingLength:{n:"Swing Length",w:"Distance the bat head travels to contact, in feet.",y:"The contact-versus-power tradeoff made measurable. Shorter swings raise average and lower slugging; longer swings do the reverse. League average is about 7.3 feet.",c:"Total path of the bat head from swing start to contact"},squaredUp:{n:"Squared-Up Rate",w:"How much of the available exit velocity the hitter actually captured.",y:"Isolates contact efficiency from contact force. A slow swing perfectly squared up scores higher than a violent swing that gets jammed \u2014 which is how contact-first hitters produce.",c:"Actual exit velocity / maximum possible given bat and pitch speed. 80%+ counts as squared up."},blast:{n:"Blast Rate",w:"A swing that is both squared up and fast.",y:"The most valuable swing type. Blasts produced roughly a .563 average and 1.182 slugging in 2024, against almost nothing on everything else.",c:"(squared-up % \xD7 100) + bat speed \u2265 164"},attackAngle:{n:"Attack Angle",w:"The vertical angle of the bat's path at contact.",y:"Separates swing plane from swing result. Good [[EV]] still yields weak contact if the path doesn't match the pitch plane. The productive band is roughly 5\u201320 degrees.",c:"Measured at the moment of contact"},interceptPoint:{n:"Intercept Point",w:"How far in front of the plate contact occurs.",y:"A timing diagnostic. Contact made deep in the zone limits pull power; contact too far out front means early, and vulnerable to offspeed.",c:"Measured in inches relative to the middle of home plate"},oSwing:{n:"Chase Rate (O-Swing%)",w:"How often a hitter swings at pitches outside the zone.",y:"The most stable offensive statistic in baseball \u2014 it becomes meaningful faster than almost anything else, which makes it valuable in small samples and prospect work.",c:"(swings at pitches outside the zone) / (pitches outside the zone)"},zSwing:{n:"Z-Swing%",w:"How often a hitter swings at strikes.",y:"Pairs with [[O-Swing%]] to describe approach. High Z-Swing with low chase is the ideal profile: aggressive on strikes, disciplined off them.",c:"(swings at pitches in the zone) / (pitches in the zone)"},contactPct:{n:"Contact%",w:"Share of swings that make contact.",y:"Drives [[K%]] directly. Contact on pitches outside the zone is double-edged \u2014 it produces weak outs, so it isn't purely a positive.",c:"contact / swings, also split by zone as O-Contact% and Z-Contact%"},swStr:{n:"Swinging Strike Rate",w:"Share of all pitches that produce a swing and miss.",y:"The best quick proxy for pitcher stuff. Correlates strongly with strikeout rate and stabilizes fast.",c:"swinging strikes / total pitches"},whiff:{n:"Whiff%",w:"Share of swings that miss.",y:"Same idea as [[SwStr%]] but with a swings denominator, which removes how often hitters offer. Better for isolating bat-missing ability from inducing swings.",c:"swings and misses / total swings"},csw:{n:"CSW% \u2014 Called Strikes Plus Whiffs",w:"Share of pitches producing either a called strike or a swinging strike.",y:"Broader than [[SwStr%]] because it rewards stealing called strikes, not just missing bats. Around 30% is average; 33%+ is strong.",c:"(called strikes + swinging strikes) / total pitches"},zonePct:{n:"Zone%",w:"Share of pitches in the strike zone.",y:"Command and aggression indicator, and it reveals when a hitter is being pitched around.",c:"pitches in the zone / total pitches"},fStrike:{n:"First-Pitch Strike Rate",w:"Share of plate appearances starting with a strike.",y:"Count leverage is enormous \u2014 hitters in 0-1 counts perform dramatically worse than in 1-0. League average is around 60%.",c:"PA beginning with a strike / total PA"},bsr:{n:"BsR \u2014 Base Running Runs",w:"Total baserunning value above average, in runs.",y:"The complete picture. Most people look only at stolen bases, which is the smallest part of it \u2014 taking extra bases on hits matters more in aggregate.",c:"[[UBR]] + [[wSB]] + [[wGDP]]"},ubr:{n:"UBR \u2014 Ultimate Base Running",w:"Run value of non-steal advancement: first to third, scoring from second, tagging up.",y:"The largest and most overlooked baserunning component.",c:"Each advancement is compared to league-average behavior in the same base/out state and converted to runs"},wsb:{n:"wSB \u2014 Weighted Stolen Base Runs",w:"Run value of stealing, net of getting caught.",y:"Corrects the intuition that steals are simply good. A caught stealing costs about twice what a steal gains, so break-even sits near a 72\u201375% success rate.",c:"(SB \xD7 runSB) + (CS \xD7 runCS) \u2212 league wSB rate \xD7 (1B + BB + HBP \u2212 IBB)"},wgdp:{n:"wGDP \u2014 Double Play Runs",w:"Runs gained or lost by avoiding double plays.",y:"Small but real, and it's where speed shows up outside of steals.",c:"GDP rate versus league average given opportunities, converted to runs"},spd:{n:"Spd \u2014 Speed Score",w:"A 0\u201310 estimate of raw speed built from box score data.",y:"A Bill James legacy metric, largely superseded by [[Sprint Speed]]. Still the only option for players predating tracking.",c:"Composite of steal rate, steal frequency, triples, runs scored rate, GDP rate, and position"},sprintSpeed:{n:"Sprint Speed",w:"Top-end running speed in feet per second.",y:"A direct physical measurement, uncontaminated by decisions or opportunity. Average is ~27 ft/sec, 30+ is elite, and it ages very predictably \u2014 which makes it useful for projecting decline.",c:"Feet per second in the fastest one-second window, averaged over max-effort runs"},xfip:{n:"xFIP \u2014 Expected FIP",w:"[[FIP]] with home runs replaced by a league-average rate on the pitcher's fly balls.",y:"HR/FB is volatile year to year, so xFIP often predicts better in small samples. It over-corrects for genuine home run suppressors and extreme parks.",c:"Same as FIP, but HR becomes (fly balls \xD7 league HR/FB rate)"},siera:{n:"SIERA \u2014 Skill-Interactive ERA",w:"An ERA estimator accounting for how strikeouts, walks, and batted-ball type interact.",y:"Addresses [[FIP]]'s blind spot \u2014 high-strikeout pitchers get away with more balls in play, and ground-ball pitchers suppress hits differently at different strikeout rates. Usually the most accurate estimator, at the cost of transparency.",c:"A regression on strikeout rate, walk rate, and net ground-ball rate with squared and interaction terms. Not hand-calculable."},xera:{n:"xERA \u2014 Expected ERA",w:"Statcast's ERA estimator built from quality of contact.",y:"Uses measured contact rather than batted-ball classification. Strongest when read alongside [[FIP]] \u2014 when both say the ERA is inflated, that's a real signal.",c:"Converts the pitcher's [[xwOBA]] allowed onto an ERA scale"},eraMinus:{n:"ERA\u2212 / FIP\u2212 / xFIP\u2212",w:"Each stat indexed to league and park, where 100 is average and lower is better.",y:"Makes cross-era and cross-park comparison valid. Note the direction flip versus [[wRC+]] \u2014 this trips people up constantly. 80 means 20% better than average.",c:"100 \xD7 (stat / (league stat \xD7 park factor))"},lob:{n:"LOB% \u2014 Strand Rate",w:"Share of baserunners the pitcher strands.",y:"A luck flag. League average is ~72%. At 85% the ERA flatters him; at 62% it overstates the damage. Elite strikeout pitchers do sustainably strand more.",c:"(H + BB + HBP \u2212 R) / (H + BB + HBP \u2212 1.4 \xD7 HR)"},hrfb:{n:"HR/FB \u2014 Home Run per Fly Ball",w:"Share of fly balls that leave the yard.",y:"A regression flag for both hitters and pitchers. League average is 12\u201314%; large deviations usually come back.",c:"HR / fly balls"},sdmd:{n:"Shutdowns and Meltdowns",w:"Relief outings that meaningfully helped or hurt the team's win probability.",y:"A far better reliever measure than saves and holds, which depend entirely on manager usage. Escaping a bases-loaded seventh counts here and earns nothing in the save column.",c:"Shutdown: relief appearance with [[WPA]] \u2265 +0.06. Meltdown: \u2264 \u22120.06."},tera:{n:"tERA \u2014 True Runs Allowed",w:"An older estimator crediting pitchers for batted-ball type.",y:"Largely superseded by [[SIERA]], but occasionally still cited.",c:"Assigns expected run values to each batted-ball class, scaled to ERA"},stuffPlus:{n:"Stuff+ / Location+ / Pitching+",w:"Three models scoring pitch characteristics, pitch location, and the two combined. 100 is average.",y:"Separates what a pitcher throws from where he throws it. Stuff+ stabilizes extremely fast \u2014 a handful of starts \u2014 making it the best early-season signal available on a pitcher.",c:"Stuff+ uses only physical inputs and no location or results. Location+ uses only location and count. Both are proprietary regressions."},spinRate:{n:"Spin Rate and Spin Axis",w:"Spin in RPM, and the tilt of the axis that spin acts on.",y:"Spin rate alone is nearly meaningless without axis. Spin that isn't oriented to generate Magnus force produces no movement at all \u2014 which is why two pitchers at 2,600 rpm can get completely different results.",c:"Measured by Hawk-Eye. Active spin compares observed movement to what total spin would theoretically produce."},ivb:{n:"Induced Vertical Break",w:"Movement caused by spin, with gravity's effect removed.",y:"The 'rise' on a four-seam fastball. High-IVB fastballs at the top of the zone generate swings under the ball. Raw vertical drop is misleading because gravity affects every pitch equally.",c:"Observed trajectory minus the trajectory of a hypothetical spinless pitch"},extension:{n:"Extension",w:"How far in front of the rubber the ball is released.",y:"Buys perceived velocity. Seven feet of extension makes 94 mph play like 96 by shortening reaction time \u2014 which is why some pitchers outperform their radar readings.",c:"Measured directly at release, in feet"},vaa:{n:"VAA \u2014 Vertical Approach Angle",w:"The steepness at which the pitch crosses the plate.",y:"A flat VAA on a high fastball is deceptive because it defies the hitter's expectation of downward plane. Partly a function of release height, which can give shorter pitchers an edge up in the zone.",c:"Derived from trajectory at the front of the plate"},pitchLW:{n:"Pitch Type Linear Weights",w:"Runs above average generated by each individual pitch type.",y:"Answers which pitch is actually working. Always read the per-100 version \u2014 a pitcher throwing 2,000 fastballs accumulates more raw value than one throwing 200 curveballs regardless of quality.",c:"Sum of run expectancy change across all pitches of that type"},drs:{n:"DRS \u2014 Defensive Runs Saved",w:"Total runs saved above an average fielder at the same position.",y:"One of the three main defensive systems. Broader than [[OAA]] because it includes arm, double plays, and errors \u2014 not just range.",c:"Sum of components: range, outfield arm, double plays, stolen base prevention, and scout-identified good plays and misplays"},uzr:{n:"UZR \u2014 Ultimate Zone Rating",w:"Runs saved relative to average, from zone-based batted-ball data.",y:"FanGraphs' defensive input to [[WAR]]. Slow to stabilize \u2014 one season of UZR carries roughly the reliability of a quarter-season of hitting data, so three-year samples are the honest minimum.",c:"Outs made in each zone versus league-average conversion, adjusted for park, batted-ball speed, and handedness"},oaa:{n:"OAA \u2014 Outs Above Average",w:"Statcast's range metric: outs made above what an average fielder converts on the same chances.",y:"The most direct of the three, because it uses actual ball trajectory and fielder positioning rather than zone approximation. Range only \u2014 it captures no arm, double plays, or errors.",c:"Each ball gets a catch probability from distance, time, and direction. A fielder earns (1 \u2212 probability) for a play made and loses the probability for one missed."},framing:{n:"Catcher Framing Runs",w:"Runs saved by turning borderline pitches into called strikes.",y:"Was among the largest single defensive skills in the game \u2014 elite framers were worth 15\u201320 runs a season, more than most fielders produce with their glove. Its future is uncertain under the automated ball-strike challenge system.",c:"A model estimates called-strike probability per taken pitch; the catcher is credited with the difference from expectation"},popTime:{n:"Pop Time",w:"Catcher's time from mitt to the fielder's glove at second base.",y:"Isolates the catcher from the pitcher's delivery time. Under 1.90 seconds is elite; league average is about 2.00.",c:"Measured directly on stolen base attempts"},rzr:{n:"RZR \u2014 Revised Zone Rating",w:"Share of balls hit into a fielder's zone that he converts.",y:"Simpler and more transparent than [[UZR]]. The companion OOZ stat \u2014 plays made outside the zone \u2014 is the real range indicator.",c:"plays made in zone / balls hit into zone"},def:{n:"Def \u2014 Defensive Runs Above Average",w:"Complete defensive value including the positional adjustment.",y:"Puts a shortstop and a first baseman on one scale. An average-fielding shortstop is far more valuable than an average-fielding first baseman.",c:"fielding runs ([[UZR]] or [[DRS]]) + [[Positional Adjustment]]"},wpa:{n:"WPA \u2014 Win Probability Added",w:"Cumulative change in win probability attributable to a player.",y:"The best measure of what actually happened in context \u2014 a walk-off homer is worth far more than a solo shot in a 12-1 game. Descriptive, not predictive: it tells the story of the season, not what comes next.",c:"For each event, the change in win expectancy given inning, score, outs, and baserunners, summed"},wpaLI:{n:"WPA/LI \u2014 Situational Wins",w:"[[WPA]] with the leverage of each situation divided out.",y:"Context-neutral. Credits the quality of the outcome without the accident of when it happened.",c:"Each event's WPA divided by its leverage index, then summed"},clutch:{n:"Clutch",w:"How much better or worse a player performed in high-leverage spots than his own baseline.",y:"Constantly misread. It measures a player against himself, not the league \u2014 so a great hitter slightly down in high leverage posts a negative Clutch while still outproducing everyone. It has almost no year-to-year stability, which is the strongest evidence against clutch hitting as a durable skill.",c:"(WPA / pLI) \u2212 [[WPA/LI]]"},re24:{n:"RE24 \u2014 Run Expectancy 24",w:"Runs added relative to the run expectancy of the base/out state inherited.",y:"Context-sensitive like [[WPA]] but denominated in runs, so it isn't distorted by score and inning. A good middle ground.",c:"For each event: (run expectancy after \u2212 before + runs scored), summed across the 24 base/out states"},li:{n:"LI \u2014 Leverage Index",w:"How much the current situation matters, with 1.0 average.",y:"The essential input to bullpen analysis. A 3.0 LI spot is three times as consequential as average \u2014 and it reveals when a manager is saving his best arm for a save situation that matters less than the jam in the seventh.",c:"The potential win probability swing from the current state, relative to an average state"},pythag:{n:"Pythagorean Win-Loss",w:"Expected record from runs scored and allowed.",y:"Identifies teams outrunning or lagging their run differential. Large gaps usually regress, though bullpen quality creates some genuine persistent deviation.",c:"Win% = R^1.83 / (R^1.83 + RA^1.83)"},baseRuns:{n:"BaseRuns",w:"Expected runs from a team's component events, with sequencing stripped out.",y:"Goes a level deeper than [[Pythagorean]] \u2014 it asks whether the runs themselves were sequencing luck, not just whether the record matched the runs.",c:"A \xD7 B/(B + C) + D, where A is baserunners, B advancement, C outs, D home runs"},warVersions:{n:"fWAR vs rWAR vs WARP",w:"The FanGraphs, Baseball Reference, and Baseball Prospectus versions of [[WAR]].",y:"The gap is almost entirely on the pitching side. FanGraphs builds pitcher value on [[FIP]], using only walks, home runs, and strikeouts. Baseball Reference uses runs actually allowed, which credits pitchers who succeed through weak contact and defense. Batting and baserunning are nearly identical across all three \u2014 always specify which you're citing.",c:"Same framework, different run-prevention inputs"},positional:{n:"Positional Adjustment",w:"A run adjustment for the relative difficulty of each defensive position.",y:"The mechanism that makes cross-position [[WAR]] comparison valid.",c:"Per 150 games, roughly: C +12.5, SS +7.5, 2B/3B/CF +2.5, LF/RF \u22127.5, 1B \u221212.5, DH \u221217.5"},replacement:{n:"Replacement Level",w:"The production baseline from a freely available waiver-wire or minor league player.",y:"Comparing to average instead would make a one-game average player as valuable as a full-season average player. Replacement level fixes that and makes playing time count.",c:"About 20 runs per 600 PA below average       @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap');

      *, *::before, *::after { box-sizing: border-box; }

      .dmd {
        --field:   #0B1710;
        --dugout:  #132318;
        --line:    #22392A;
        --chalk:   #EFF3ED;
        --muted:   #7E9587;
        --bulb:    #F2B441;
        --cyan:    #57C4D8;
        --loss:    #3E5849;

        background: var(--field);
        color: var(--chalk);
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        padding: 0 0 64px;
        -webkit-font-smoothing: antialiased;
      }

      .dmd-inner { max-width: 640px; margin: 0 auto; padding: 0 16px; }

      .mono { font-family: 'Roboto Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .disp { font-family: 'Oswald', 'Inter', sans-serif; letter-spacing: .02em; }

      /* masthead ---------------------------------------------------------- */
      .mast {
        display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
        padding: 18px 0 12px;
        border-bottom: 1px solid var(--line);
      }
      .mast .navwrap { margin-left: auto; display: flex; gap: 5px; }
      .mast .navwrap .selbtn { padding: 7px 9px; font-size: 10px; }
      .mast h1 {
        font-family: 'Oswald', sans-serif; font-weight: 600;
        font-size: 22px; letter-spacing: .16em; text-transform: uppercase;
        margin: 0; color: var(--chalk);
      }
      .mast .sub {
        font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
        color: var(--muted); font-family: 'Roboto Mono', monospace;
      }

      /* search ------------------------------------------------------------ */
      .searchwrap { position: relative; margin-top: 18px; }
      .searchwrap + .searchwrap { margin-top: 10px; }
      .slot {
        font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
        color: var(--muted); font-family: 'Roboto Mono', monospace;
        display: block; margin-bottom: 6px;
      }
      .field {
        width: 100%; background: var(--dugout); border: 1px solid var(--line);
        color: var(--chalk); padding: 13px 14px; font-size: 16px;
        font-family: 'Inter', sans-serif; border-radius: 2px; outline: none;
      }
      .field::placeholder { color: var(--loss); }
      .field:focus { border-color: var(--bulb); }
      .field.b:focus { border-color: var(--cyan); }

      .drophead {
        font-family: 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--muted); padding: 10px 14px 7px;
        border-bottom: 1px solid var(--line);
      }
      .drop {
        position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px);
        background: var(--dugout); border: 1px solid var(--line);
        max-height: 264px; overflow-y: auto; border-radius: 2px;
      }
      .opt {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 10px; width: 100%; text-align: left; background: none; border: 0;
        border-bottom: 1px solid var(--line); padding: 11px 14px;
        color: var(--chalk); font-size: 15px; cursor: pointer;
        font-family: 'Inter', sans-serif;
      }
      .opt:last-child { border-bottom: 0; }
      .opt:hover, .opt:focus-visible { background: var(--line); outline: none; }
      .opt .meta {
        font-family: 'Roboto Mono', monospace; font-size: 11px;
        color: var(--muted); white-space: nowrap;
      }

      .meta-line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
      .stamp {
        background: none; border: 0; padding: 6px 2px; cursor: pointer; margin-left: auto;
        font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: .1em;
        color: var(--loss); display: inline-flex; align-items: center; gap: 6px;
        text-transform: uppercase; white-space: nowrap;
      }
      .stamp:hover, .stamp:focus-visible { color: var(--chalk); outline: none; }
      .stampdot { width: 5px; height: 5px; border-radius: 50%; background: var(--loss); flex: none; }
      .stampdot[data-busy="1"] { background: var(--bulb); animation: blink 1s infinite; }
      .selbtn {
        background: var(--dugout); border: 1px solid var(--line); color: var(--chalk);
        font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .08em;
        padding: 8px 11px; border-radius: 2px; cursor: pointer; white-space: nowrap;
      }
      .selbtn:hover, .selbtn:focus-visible { border-color: var(--bulb); outline: none; }
      .selbtn .car { color: var(--muted); margin-left: 6px; }
      .selwrap { position: relative; }
      .selmenu {
        position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 190px;
        background: var(--dugout); border: 1px solid var(--line); border-radius: 2px;
      }
      .selopt {
        display: block; width: 100%; text-align: left; background: none; border: 0;
        border-bottom: 1px solid var(--line); padding: 11px 13px; cursor: pointer;
        color: var(--chalk); font-family: 'Inter', sans-serif; font-size: 14px;
      }
      .selopt:last-child { border-bottom: 0; }
      .selopt:hover, .selopt:focus-visible { background: var(--line); outline: none; }
      .selopt small {
        display: block; font-family: 'Roboto Mono', monospace; font-size: 10px;
        color: var(--muted); margin-top: 3px; letter-spacing: .06em;
      }
      .selopt[data-on="1"] { color: var(--bulb); }

      /* read / flags ------------------------------------------------------ */
      .read { margin-top: 18px; border-left: 2px solid var(--bulb); padding: 2px 0 2px 13px; }
      .read h4 {
        font-family: 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .18em;
        text-transform: uppercase; color: var(--muted); margin: 0 0 9px; font-weight: 400;
      }
      .flag { font-size: 13.5px; line-height: 1.6; margin: 0 0 8px; }
      .flag:last-child { margin-bottom: 0; }
      .flag b { color: var(--bulb); font-weight: 600; }

      /* reliability ------------------------------------------------------- */
      .rel {
        font-family: 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--loss); white-space: nowrap;
      }
      .rel[data-r="settled"] { color: #8FA894; }
      .rel[data-r="forming"] { color: var(--muted); }

      /* learn ------------------------------------------------------------- */
      @keyframes ptrspin { to { transform: rotate(360deg); } }
      .ptr { display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
      .ptrin {
        display: flex; align-items: center; gap: 8px; padding-bottom: 10px;
        font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--muted); transition: color .2s;
      }
      .ptrin[data-on="1"] { color: var(--bulb); }
      .ptrdot {
        width: 9px; height: 9px; border: 1px solid currentColor; border-top-color: transparent;
        border-radius: 50%; display: inline-block;
      }
      .ptrdot[data-spin="1"] { animation: ptrspin .7s linear infinite; }

      .strow {
        display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: baseline;
        padding: 13px 2px; border-bottom: 1px solid var(--line);
      }
      .stk {
        font-family: 'Roboto Mono', monospace; font-size: 12px; letter-spacing: .08em;
        text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 9px;
      }
      .stdot { width: 7px; height: 7px; border-radius: 50%; background: var(--loss); flex: none; }
      .stdot[data-s="y"] { background: var(--bulb); }
      .stdot[data-s="n"] { background: var(--loss); }
      .stv {
        font-family: 'Roboto Mono', monospace; font-size: 13px; color: var(--chalk);
        text-align: right;
      }
      .stv small { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }

      .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 16px; }
      .sortchip {
        background: var(--dugout); border: 1px solid var(--line); color: var(--muted);
        font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: .08em;
        padding: 6px 9px; border-radius: 2px; cursor: pointer;
      }
      .sortchip[data-on="1"] { border-color: var(--bulb); color: var(--bulb); }
      .sortchip[data-dead="1"] { opacity: .34; text-decoration: line-through; }
      .sortchip:hover, .sortchip:focus-visible { color: var(--chalk); outline: none; }

      .teamrow {
        display: grid; grid-template-columns: 22px 1fr 90px 62px; gap: 10px;
        align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .teamrow[data-pin="1"] { background: var(--dugout); box-shadow: inset 2px 0 0 var(--bulb); }
      .pinbox { border: 1px solid var(--bulb); border-radius: 2px; padding: 12px 13px; margin: 4px 0 14px; }
      .pinhead {
        display: flex; justify-content: space-between; align-items: center;
        font-family: 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
      }
      .pinclear { background: none; border: 0; color: var(--muted); cursor: pointer;
        font-family: 'Roboto Mono', monospace; font-size: 9px; letter-spacing: .14em;

      .pinclear:hover { color: var(--chalk); }
      .pinrow { display: grid; grid-template-columns: 1fr auto 62px; gap: 10px;

      .pinrank { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--muted); }
      .trail { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
      .trailhead {
        display: flex; justify-content: space-between; align-items: center;

        text-transform: uppercase; color: var(--muted); margin-bottom: 8px;

        display: grid; grid-template-columns: 1fr 62px; gap: 10px;

      .catitem {
        width: 100%; background: none; border: 0; padding: 9px 2px; cursor: pointer;
        display: flex; gap: 12px; align-items: baseline; text-align: left; color: var(--muted);
      }
      .catitem:hover, .catitem:focus-visible { color: var(--chalk); outline: none; }
      .catitem b {
        font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--bulb);
        min-width: 72px; font-weight: 500;
      }
      .catitem i { font-style: normal; font-size: 13.5px; }

      .range {
        font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--muted);
        letter-spacing: .14em; text-transform: uppercase; padding: 9px 2px 2px;
      }

      /* percentile -------------------------------------------------------- */
      .prow { padding: 12px 2px 13px; border-bottom: 1px solid var(--line); }
      .ptop { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
      .pwrap { display: grid; grid-template-columns: 1fr 30px; gap: 9px; align-items: center; margin-top: 9px; }
      .ptrack { height: 4px; background: var(--line); position: relative; }
      .pfill { height: 100%; transition: width .5s cubic-bezier(.22,.61,.36,1); }
      .pfill[data-t="elite"] { background: var(--bulb); }
      .pfill[data-t="good"]  { background: #8FA894; }
      .pfill[data-t="mid"]   { background: var(--loss); }
      .pfill[data-t="low"]   { background: #2C4034; }
      .ptick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; left: 50%; }
      .pnum {
        font-family: 'Roboto Mono', monospace; font-size: 10px; text-align: right;
        color: var(--muted); font-variant-numeric: tabular-nums;
      }
      .pnum[data-t="elite"] { color: var(--bulb); }
      .cpct {
        font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--muted);
        font-variant-numeric: tabular-nums; margin-top: 3px;
      }
      .cpct[data-t="elite"] { color: var(--bulb); }
      .cpct.l { text-align: right; }
      .cpct.r { text-align: left; }

      /* headshots --------------------------------------------------------- */
      .shot {
        width: 64px; height: 64px; flex: none; border-radius: 2px;
        background: var(--dugout); border: 1px solid var(--line);
        object-fit: contain; object-position: center bottom;
      }
      .shot.a { border-color: var(--bulb); }
      .shot.b { border-color: var(--cyan); }
      .mono-init {
        display: flex; align-items: center; justify-content: center;
        font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--muted);
        letter-spacing: .04em;
      }
      .whead { display: flex; align-items: center; gap: 14px; }
      .vs {
        font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--muted);
        letter-spacing: .18em; text-transform: uppercase; padding: 8px 0 8px 58px;
      }

      /* cross-links in definitions ---------------------------------------- */
      .xl {
        background: none; border: 0; padding: 0 1px; cursor: pointer;
        color: var(--bulb); font: inherit;
        border-bottom: 1px dotted var(--bulb);
      }
      .xl:hover, .xl:focus-visible { color: var(--chalk); border-bottom-color: var(--chalk); outline: none; }
      .crumb {
        display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      }
      .back {
        background: none; border: 1px solid var(--line); color: var(--muted);
        font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: .12em;
        text-transform: uppercase; padding: 6px 10px; cursor: pointer; border-radius: 2px;
      }
      .back:hover, .back:focus-visible { color: var(--chalk); border-color: var(--chalk); outline: none; }

      /* nameplate --------------------------------------------------------- */
      .plate { padding: 22px 0 4px; }
      .plate .nm {
        font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 30px;
        line-height: 1.06; margin: 0; text-transform: uppercase; letter-spacing: .01em;
      }
      .plate .nm.b { color: var(--cyan); }
      .plate .nm.a { color: var(--bulb); }
      .plate .det {
        font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--muted);
        margin-top: 7px; letter-spacing: .06em; text-transform: uppercase;
      }

      /* controls ---------------------------------------------------------- */
      .rail {
        display: flex; gap: 0; margin: 18px 0 0;
        border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
      }
      .rail button {
        flex: 1; background: transparent; border: 0; color: var(--muted);
        padding: 11px 6px; font-size: 11px; letter-spacing: .14em;
        text-transform: uppercase; cursor: pointer;
        font-family: 'Roboto Mono', monospace;
        border-right: 1px solid var(--line);
      }
      .rail button:last-child { border-right: 0; }
      .rail button[data-on="1"] { background: var(--chalk); color: var(--field); font-weight: 700; }
      .rail button:focus-visible { outline: 2px solid var(--bulb); outline-offset: -2px; }

      /* stat rows --------------------------------------------------------- */
      .rows { margin-top: 4px; }
      .row {
        display: grid; grid-template-columns: 1fr auto;
        align-items: center; gap: 12px;
        padding: 12px 2px; border-bottom: 1px solid var(--line);
      }
      .lbl {
        background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
        color: var(--muted); font-family: 'Roboto Mono', monospace;
        font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .lbl:hover, .lbl:focus-visible { color: var(--chalk); outline: none; }
      .calcflag {
        font-family: 'Roboto Mono', monospace; font-size: 8px; font-weight: 700;
        letter-spacing: .1em; color: var(--bulb); border: 1px solid var(--bulb);
        border-radius: 2px; padding: 1px 3px; line-height: 1.2; flex: none;
      }
      .val {
        font-family: 'Roboto Mono', monospace; font-weight: 500;
        font-size: 19px; color: var(--chalk); font-variant-numeric: tabular-nums;
      }

      .colhead {
        display: grid; grid-template-columns: 1fr 92px 1fr; gap: 8px;
        align-items: end; position: sticky; top: 0; z-index: 20;
        background: var(--field); padding: 11px 0 9px;
        border-bottom: 1px solid var(--line); margin-bottom: 2px;
      }
      .colname {
        font-family: 'Oswald', sans-serif; font-size: 13px; text-transform: uppercase;
        letter-spacing: .04em; line-height: 1.15;
      }
      .colname.l { text-align: right; color: var(--bulb); }
      .colname.r { text-align: left; color: var(--cyan); }
      .colname small {
        display: block; font-family: 'Roboto Mono', monospace; font-size: 9px;
        color: var(--muted); letter-spacing: .1em; margin-top: 3px;
      }
      .colswatch { display: block; height: 3px; margin-bottom: 6px; }
      .colswatch.a { background: var(--bulb); }
      .colswatch.b { background: var(--cyan); }

      /* compare spine ----------------------------------------------------- */
      .crow { padding: 13px 0 12px; border-bottom: 1px solid var(--line); }
      .cnums {
        display: grid; grid-template-columns: 1fr 92px 1fr; align-items: center; gap: 8px;
      }
      .cnum {
        font-family: 'Roboto Mono', monospace; font-size: 19px; font-weight: 500;
        font-variant-numeric: tabular-nums; color: var(--loss);
      }
      .cnum.win { color: var(--chalk); font-weight: 700; }
      .cnum.l { text-align: right; }
      .cnum.r { text-align: left; }
      .cmid {
        text-align: center; font-family: 'Roboto Mono', monospace;
        font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
        color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0;
      }
      .cmid:hover, .cmid:focus-visible { color: var(--chalk); outline: none; }

      .cnums.barsmode { grid-template-columns: 1fr auto 1fr; }
      .barstack { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
      .barrow { display: grid; grid-template-columns: 62px 1fr 22px; gap: 9px; align-items: center; }
      .barlab {
        font-family: 'Roboto Mono', monospace; font-size: 13px; text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .barlab.a { color: var(--bulb); }
      .barlab.b { color: var(--cyan); }
      .bartrack { height: 9px; background: var(--line); }
      .barpct {
        font-family: 'Roboto Mono', monospace; font-size: 9px; color: var(--muted);
        text-align: right; font-variant-numeric: tabular-nums;
      }
      .bars { display: grid; grid-template-columns: 1fr 92px 1fr; gap: 8px; margin-top: 7px; }
      .track { height: 7px; display: flex; }
      .track.l { justify-content: flex-end; }
      .fill { height: 100%; transition: width .5s cubic-bezier(.22,.61,.36,1); }
      .fill.a { background: var(--bulb); }
      .fill.b { background: var(--cyan); }
      .fill.dim { opacity: .32; }

      /* misc -------------------------------------------------------------- */
      .note {
        font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--muted);
        line-height: 1.6; padding: 16px 0 0;
      }
      .chip {
        display: inline-block; font-family: 'Roboto Mono', monospace; font-size: 10px;
        letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px;
        border: 1px solid var(--line); color: var(--muted); border-radius: 2px;
        margin: 14px 0 0;
      }
      .chip[data-s="ok"] { border-color: var(--bulb); color: var(--bulb); }
      .chip[data-s="no"] { border-color: var(--loss); }

      .empty {
        padding: 52px 0; text-align: center; color: var(--muted);
        font-family: 'Roboto Mono', monospace; font-size: 12px; line-height: 1.8;
      }
      .err {
        border: 1px solid var(--bulb); border-left-width: 3px; padding: 12px 14px;
        margin-top: 16px; font-size: 13px; color: var(--chalk); border-radius: 2px;
      }

      /* definition sheet --------------------------------------------------- */
      .scrim {
        position: fixed; inset: 0; background: rgba(6,12,8,.82);
        display: flex; align-items: flex-end; justify-content: center; z-index: 60;
        padding: 16px;
      }
      .sheet {
        background: var(--dugout); border: 1px solid var(--line);
        max-width: 608px; width: 100%; padding: 22px 20px 20px; border-radius: 3px;
        max-height: 78vh; overflow-y: auto;
      }
      .sheet h3 {
        font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 21px;
        margin: 0 0 3px; text-transform: uppercase; letter-spacing: .03em;
      }
      .sheet .abbr {
        font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--bulb);
        letter-spacing: .12em; text-transform: uppercase;
      }
      .sheet dt {
        font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--muted);
        letter-spacing: .14em; text-transform: uppercase; margin-top: 16px;
      }
      .sheet dd { margin: 5px 0 0; font-size: 14px; line-height: 1.62; }
      .sheet dd.calc {
        font-family: 'Roboto Mono', monospace; font-size: 12px;
        color: var(--muted); line-height: 1.6;
      }
      .close {
        width: 100%; margin-top: 22px; background: var(--chalk); color: var(--field);
        border: 0; padding: 12px; font-family: 'Roboto Mono', monospace;
        font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
        cursor: pointer; border-radius: 2px; font-weight: 700;
      }

      /* loading ----------------------------------------------------------- */
      @keyframes runner {
        0%, 68%, 100% { opacity: .16; transform: rotate(45deg) scale(1); }
        18%           { opacity: 1;   transform: rotate(45deg) scale(1.5); }
      }
      @keyframes shim { 0%, 100% { opacity: .22; } 50% { opacity: .55; } }
      @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

      .loader { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 46px 0; }
      .infield { position: relative; width: 58px; height: 58px; }
      .base {
        position: absolute; width: 10px; height: 10px; background: var(--bulb);
        transform: rotate(45deg); animation: runner 1.9s infinite ease-in-out;
      }
      .base.home  { bottom: 0; left: 50%; margin-left: -5px; animation-delay: 0s; }
      .base.first { right: 0; top: 50%; margin-top: -5px;   animation-delay: .38s; }
      .base.second{ top: 0; left: 50%; margin-left: -5px;   animation-delay: .76s; }
      .base.third { left: 0; top: 50%; margin-top: -5px;    animation-delay: 1.14s; }
      .loader .cap {
        font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--muted);
        letter-spacing: .16em; text-transform: uppercase;
      }

      .sk { background: var(--line); border-radius: 2px; animation: shim 1.5s infinite ease-in-out; }
      .skrow {
        display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
        padding: 16px 2px; border-bottom: 1px solid var(--line);
      }
      .skcmp { padding: 17px 0 16px; border-bottom: 1px solid var(--line);
               display: grid; grid-template-columns: 1fr 92px 1fr; align-items: center; gap: 8px; }

      .pulse { animation: blink 1.3s infinite ease-in-out; }

      @media (prefers-reduced-motion: reduce) {
        .fill { transition: none; }
        .base, .sk, .pulse { animation: none; }
        .base { opacity: .6; }
        .sk { opacity: .35; }
      }
